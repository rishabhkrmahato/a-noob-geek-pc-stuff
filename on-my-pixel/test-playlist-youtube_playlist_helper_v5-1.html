<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="A mobile-first YouTube Playlist Helper.">
<title>YouTube Playlist Helper</title>
<style>
:root{
  color-scheme:dark;
  --bg:#090a0e;--card:#12141a;--card2:#181b23;
  --line:rgba(255,255,255,.085);--text:#f5f6fa;--muted:#969baa;
  --purple:#9a8cff;--mint:#63e8ca;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;background:
  radial-gradient(650px 300px at 50% -90px,rgba(154,140,255,.18),transparent 70%),
  var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button,a{font:inherit}
button{cursor:pointer}
button:active,.item:active{transform:scale(.98)}
.app{width:min(100%,760px);margin:auto;padding:0 14px 38px}
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(10px + env(safe-area-inset-top)) 0 12px;
  background:linear-gradient(to bottom,rgba(9,10,14,.98) 78%,rgba(9,10,14,.88));
  backdrop-filter:blur(18px);
}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#bbb4ff}
.progressText{
  appearance:none;-webkit-appearance:none;
  border:1px solid rgba(154,140,255,.16);
  background:rgba(154,140,255,.065);
  color:var(--muted);
  font-size:12px;font-weight:650;line-height:1;
  cursor:pointer;
  padding:7px 10px;
  margin:-3px 0;
  border-radius:10px;
  transition:background .15s,color .15s,border-color .15s,transform .12s;
}
.progressText:active{
  background:rgba(154,140,255,.16);
  color:var(--text);
  border-color:rgba(154,140,255,.3);
  transform:scale(.97);
}
.progress{height:4px;border-radius:99px;background:#20232b;overflow:hidden;margin-bottom:13px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--mint));transition:width .28s ease}
.current{
  padding:14px 15px;border:1px solid rgba(154,140,255,.25);border-radius:16px;
  background:linear-gradient(135deg,rgba(154,140,255,.11),rgba(99,232,202,.045));
  margin-bottom:10px;
}
.eyebrow{font-size:11px;color:var(--mint);font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}
.currentTitle{margin:0;font-size:16px;line-height:1.35;font-weight:750}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{min-height:50px;border:0;border-radius:14px;font-weight:800;font-size:15px;transition:transform .12s ease,opacity .12s ease}
.open{color:#0b0c10;background:linear-gradient(135deg,#f1eeff,#bcb3ff)}
.next{color:#f3f4f7;background:#1a1d24;border:1px solid var(--line)}
.back{width:100%;min-height:38px;margin-top:6px;color:var(--muted);background:transparent;font-size:13px;font-weight:650}
.hint{text-align:center;color:var(--muted);font-size:11px;line-height:1.35;margin:2px 2px 0}
.list{padding-top:6px}
.item{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:58px;
  margin:0 0 8px;padding:11px 12px;border:1px solid var(--line);border-radius:15px;
  background:rgba(18,20,26,.82);color:var(--text);text-decoration:none;
  transition:opacity .2s,border-color .2s,background .2s,transform .12s;
}
.item.currentItem{border-color:rgba(154,140,255,.58);background:linear-gradient(135deg,rgba(154,140,255,.13),rgba(18,20,26,.96))}
.item.done{opacity:.37}
.item.done .title{text-decoration:line-through;text-decoration-thickness:1.5px}
.num{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.055);color:var(--muted);font-size:12px;font-weight:750}
.currentItem .num{color:#0b0c10;background:linear-gradient(135deg,#c9c1ff,#74e9d0)}
.title{font-size:14px;line-height:1.3;font-weight:550}
.status{margin-left:auto;flex:0 0 auto;font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.05em}
.done .status{color:var(--mint)}
.footer{text-align:center;color:#606571;font-size:11px;padding:18px 0 0}

/* Return placard */
#returnOverlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:18px;opacity:0;visibility:hidden;pointer-events:none;
  background:rgba(4,5,8,.52);backdrop-filter:blur(10px);
  transition:opacity .22s ease,visibility .22s ease;
}
#returnOverlay.show{opacity:1;visibility:visible;pointer-events:auto}
.placard{
  position:relative;width:min(100%,440px);overflow:hidden;border:1px solid rgba(154,140,255,.3);
  border-radius:24px;background:
    radial-gradient(420px 180px at 20% 0,rgba(154,140,255,.17),transparent 70%),
    linear-gradient(160deg,#171922,#0f1117);
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  transform:translateY(18px) scale(.97);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
#returnOverlay.show .placard{transform:translateY(0) scale(1)}
.placardInner{padding:17px}
.placardLabel{display:flex;align-items:center;gap:7px;color:var(--mint);font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px;background:#20232b;display:block;margin-bottom:13px}
.nextMeta{display:flex;align-items:center;gap:8px;margin:0 0 7px}
.placardCount{
  font-size:11px;font-weight:750;color:#bcb6ff;padding:5px 8px;border-radius:8px;
  background:rgba(154,140,255,.1);border:1px solid rgba(154,140,255,.16);
}
.nextTitle{font-size:19px;line-height:1.28;font-weight:800;margin:0 0 15px}
.continue{
  width:100%;min-height:54px;border:0;border-radius:15px;color:#0b0c10;font-weight:850;font-size:16px;
  background:linear-gradient(100deg,#eeeaff,#a99cff,#7eead2,#eeeaff);
  background-size:240% 100%;animation:shimmer 2.6s ease-in-out infinite;
  box-shadow:0 10px 28px rgba(154,140,255,.2);
}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.dismiss{width:100%;margin-top:7px;min-height:38px;border:0;background:transparent;color:#9297a5;font-size:13px;font-weight:650}
.last{
  position:absolute;top:13px;right:13px;max-width:48%;display:flex;align-items:center;gap:7px;
  padding:6px 8px 6px 6px;border:1px solid rgba(255,255,255,.12);border-radius:12px;
  background:rgba(7,8,11,.78);backdrop-filter:blur(10px);
}
.last img{width:34px;height:20px;object-fit:cover;border-radius:5px;background:#242832}
.lastText{min-width:0;font-size:9px;color:#d8dae0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lastLabel{display:block;color:#8f95a2;font-size:8px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}

/* Jump dialog */
.jumpBox{display:none;position:fixed;inset:0;z-index:120;background:rgba(4,5,8,.6);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:18px}
.jumpBox.show{display:flex}
.jumpCard{width:min(100%,340px);padding:20px;border-radius:20px;background:#171922;border:1px solid var(--line);box-shadow:0 25px 70px #000}
.jumpCard h3{margin:0 0 6px;font-size:17px}.jumpCard p{margin:0 0 14px;color:var(--muted);font-size:12px}
.jumpInput{width:100%;height:48px;border-radius:12px;border:1px solid #343844;background:#0f1117;color:var(--text);padding:0 13px;font-size:16px;outline:none}
.jumpActions{display:flex;gap:8px;margin-top:10px}.jumpActions button{flex:1;height:45px;border:0;border-radius:12px;font-weight:750}
.go{background:#eeeaff;color:#111}.cancel{background:#242731;color:#ddd}
@media(max-width:420px){.nextTitle{font-size:18px}}
@media(prefers-color-scheme:light){
:root{color-scheme:light;--bg:#f5f6fa;--text:#171820;--muted:#737887;--line:rgba(20,22,30,.09)}
body{background:radial-gradient(650px 300px at 50% -90px,rgba(139,124,255,.15),transparent 70%),var(--bg)}
.top{background:linear-gradient(to bottom,rgba(245,246,250,.98) 78%,rgba(245,246,250,.88))}
.next{color:var(--text);background:#fff}.item{background:rgba(255,255,255,.9)}
.progressText{background:rgba(139,124,255,.075);border-color:rgba(139,124,255,.16)}
.current{background:linear-gradient(135deg,rgba(139,124,255,.10),rgba(94,231,197,.07))}
.placard{background:linear-gradient(160deg,#fff,#f4f3fa)}
#returnOverlay{background:rgba(245,246,250,.55)}
.last{background:rgba(255,255,255,.82)}
.jumpCard{background:#fff}.jumpInput{background:#f5f6fa;color:#171820}
.cancel{background:#eceef3;color:#333}
}
</style>
</head>
<body>
<div class="app">
<section class="top" id="top">
  <div class="topbar">
    <div class="brand">Playlist helper</div>
    <button class="progressText" id="progressText" aria-label="Jump to video"></button>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
  <div class="current">
    <div class="eyebrow">Now ready</div>
    <p class="currentTitle" id="currentTitle"></p>
  </div>
  <div class="controls">
    <button class="btn open" id="open">▶ Open</button>
    <button class="btn next" id="next">Next →</button>
  </div>
  <button class="btn back" id="back">↶ Undo last advance</button>
  <div class="hint">Open marks it done and prepares the next one.</div>
</section>
<main class="list" id="list"></main>
<div class="footer">Progress is saved on this device.</div>
</div>

<div id="returnOverlay" aria-hidden="true">
  <div class="placard" id="placard">
    <div class="last" id="lastBox" hidden>
      <img id="lastThumb" alt="">
      <div class="lastText"><span class="lastLabel">Last opened</span><span id="lastTitle"></span></div>
    </div>
    <div class="placardInner">
      <div class="placardLabel"><span class="dot"></span> Ready for the next one</div>
      <img class="thumb" id="nextThumb" alt="Next video thumbnail" loading="lazy">
      <div class="nextMeta"><span class="placardCount" id="placardCount"></span></div>
      <p class="nextTitle" id="placardTitle"></p>
      <button class="continue" id="continue">▶ Continue to this video</button>
      <button class="dismiss" id="dismiss">Minimize placard</button>
    </div>
  </div>
</div>

<div class="jumpBox" id="jumpBox">
  <div class="jumpCard">
    <h3>Jump to a video</h3>
    <p>Enter a number from 1 to <span id="jumpMax"></span>.</p>
    <input class="jumpInput" id="jumpInput" inputmode="numeric" type="number" min="1">
    <div class="jumpActions">
      <button class="cancel" id="cancelJump">Cancel</button>
      <button class="go" id="goJump">Go →</button>
    </div>
  </div>
</div>

let current=Number(localStorage.getItem("ytHelperIndex")||0);
if(!Number.isInteger(current)||current<0||current>videos.length)current=0;

const $=id=>document.getElementById(id);
const topEl=$("top"),list=$("list"),progressText=$("progressText"),progressBar=$("progressBar");
const currentTitle=$("currentTitle"),openBtn=$("open"),nextBtn=$("next"),backBtn=$("back");
const overlay=$("returnOverlay"),placardTitle=$("placardTitle"),placardCount=$("placardCount");
const nextThumb=$("nextThumb"),continueBtn=$("continue"),dismissBtn=$("dismiss");
const lastBox=$("lastBox"),lastThumb=$("lastThumb"),lastTitle=$("lastTitle");
let lastOpened=null;
let returning=false;

videos.forEach((v,i)=>{
  const a=document.createElement("a");
  a.className="item";a.href=v.url;a.target="_blank";a.rel="noopener noreferrer";a.dataset.index=i;
  a.innerHTML=`<span class="num">${i+1}</span><span class="title"></span><span class="status"></span>`;
  a.querySelector(".title").textContent=v.title;
  list.appendChild(a);
});

function save(){localStorage.setItem("ytHelperIndex",String(current))}
function videoId(url){
  try{
    const u=new URL(url);
    if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0];
    if(u.searchParams.get("v"))return u.searchParams.get("v");
    const m=u.pathname.match(/\/(?:shorts|embed)\/([^/?]+)/);return m?m[1]:"";
  }catch(e){return ""}
}
function setThumb(img,v){
  const id=videoId(v.url);
  if(!id){img.style.display="none";return}
  img.style.display="block";img.src="https://i.ytimg.com/vi/"+encodeURIComponent(id)+"/hqdefault.jpg";
  img.onerror=()=>{img.style.display="none"};
}
function scrollCurrent(instant=false){
  const el=list.children[current];
  if(!el){window.scrollTo({top:0,behavior:"smooth"});return}
  requestAnimationFrame(()=>{
    const offset=topEl.getBoundingClientRect().height;
    const y=el.getBoundingClientRect().top+window.scrollY-offset-8;
    window.scrollTo({top:Math.max(0,y),behavior:instant?"auto":"smooth"});
  });
}
function render(scroll=false,instant=false){
  const finished=current>=videos.length,v=videos[current];
  progressText.textContent=finished?`${videos.length} / ${videos.length}`:`${current+1} / ${videos.length}`;
  progressBar.style.width=`${Math.min(100,(current/videos.length)*100)}%`;
  currentTitle.textContent=finished?"All videos completed 🎉":v.title;
  openBtn.disabled=finished;nextBtn.disabled=finished;backBtn.disabled=current===0;
  [...list.children].forEach((el,i)=>{
    const done=i<current;
    el.classList.toggle("done",done);el.classList.toggle("currentItem",i===current);
    el.querySelector(".status").textContent=done?"✓":(i===current?"NOW":"");
  });
  if(scroll)scrollCurrent(instant);
}
function openCurrent(){
  if(current>=videos.length)return;
  const v=videos[current];lastOpened=v;
  localStorage.setItem("ytHelperLastTitle",v.title);localStorage.setItem("ytHelperLastUrl",v.url);
  current++;save();render(true);
  window.open(v.url,"_blank","noopener");
}
function showReturnPlacard(){
  if(current>=videos.length)return;
  const v=videos[current];
  placardTitle.textContent=v.title;
  placardCount.textContent=`${current+1} / ${videos.length}`;
  setThumb(nextThumb,v);
  if(lastOpened){lastTitle.textContent=lastOpened.title;setThumb(lastThumb,lastOpened);lastBox.hidden=false}
  else lastBox.hidden=true;
  overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");
}
function hideReturnPlacard(){
  overlay.classList.remove("show");overlay.setAttribute("aria-hidden","true");
}
openBtn.onclick=openCurrent;
continueBtn.onclick=()=>{hideReturnPlacard();openCurrent()};
nextBtn.onclick=()=>{if(current<videos.length){current++;save();render(true)}};
backBtn.onclick=()=>{if(current>0){current--;save();render(true)}};
dismissBtn.onclick=hideReturnPlacard;
overlay.addEventListener("click",e=>{if(e.target===overlay)hideReturnPlacard()});

// Detect return to Chrome/this page and offer the next video.
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(returning)setTimeout(showReturnPlacard,180);
    returning=true;
  }else returning=true;
});
window.addEventListener("focus",()=>{
  if(returning&&document.visibilityState==="visible")setTimeout(showReturnPlacard,180);
});

// Tap the top-right x/y counter to jump.
$("jumpMax").textContent=videos.length;
progressText.onclick=()=>{
  $("jumpInput").value=current+1;
  $("jumpBox").classList.add("show");
  setTimeout(()=>{$("jumpInput").focus();$("jumpInput").select()},50);
};
$("cancelJump").onclick=()=>$("jumpBox").classList.remove("show");
$("goJump").onclick=()=>{
  const n=Number($("jumpInput").value);
  if(n>=1&&n<=videos.length){
    current=n-1;save();$("jumpBox").classList.remove("show");render(true);
  }
};
$("jumpInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("goJump").click()});
$("jumpBox").addEventListener("click",e=>{if(e.target===$("jumpBox"))$("cancelJump").click()});

render(false,true);
</script>
