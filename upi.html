<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Pay Dr. Rishabh Kumar Mahato via UPI.">
  <title>Pay Dr. Rishabh Kumar Mahato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0f;
      --surface: rgba(20, 23, 29, 0.82);
      --surface-border: rgba(255, 255, 255, 0.09);
      --text: #f4f7fb;
      --muted: #9ba4b2;
      --accent: #45e58a;
      --accent-2: #34d6a0;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -10%, rgba(69, 229, 138, 0.11), transparent 34%),
        radial-gradient(circle at 10% 90%, rgba(31, 120, 255, 0.07), transparent 28%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .card {
      width: min(100%, 420px);
      padding: 30px;
      text-align: center;
      border: 1px solid var(--surface-border);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(26, 29, 36, 0.88), rgba(15, 17, 22, 0.90));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: rise 0.55s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .profile-link {
      display: inline-flex;
      margin-bottom: 18px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      object-fit: cover;
      object-position: center 18%;
      border-radius: 50%;
      display: block;
      border: 2px solid rgba(69, 229, 138, 0.9);
      box-shadow: 0 0 0 6px rgba(69, 229, 138, 0.06), 0 12px 30px rgba(0,0,0,0.28);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.93rem;
      line-height: 1.4;
      color: var(--muted);
    }

    .handle {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }

    .handle:hover { text-decoration: underline; }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 1.65rem);
      line-height: 1.25;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 7px 0 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .qr-wrap {
      width: min(100%, 286px);
      aspect-ratio: 1;
      margin: 0 auto 18px;
      padding: 12px;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 20px 42px rgba(0,0,0,0.28);
    }

    .qr {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 14px;
    }

    .upi-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin: 0 auto 22px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      background: rgba(255,255,255,0.035);
      color: #bcefd1;
      font-size: 0.9rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .upi-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(69,229,138,0.7);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .btn, .copy-btn {
      min-height: 48px;
      border-radius: 14px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      text-decoration: none;
      color: #04120a;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 12px 28px rgba(69,229,138,0.18);
    }

    .copy-btn {
      padding: 0 16px;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.045);
    }

    .btn:hover, .copy-btn:hover {
      transform: translateY(-2px);
    }

    .btn:active, .copy-btn:active {
      transform: translateY(0);
    }

    .copy-btn.copied {
      border-color: rgba(69,229,138,0.35);
      background: rgba(69,229,138,0.09);
      color: #bff6d5;
    }

    .footer {
      margin-top: 22px;
      font-size: 0.76rem;
      color: #68717e;
    }

    @media (max-width: 440px) {
      body { padding: 14px; }
      .card { padding: 24px 18px 20px; border-radius: 24px; }
      .avatar { width: 104px; height: 104px; }
      .qr-wrap { width: min(100%, 270px); }
      .actions { grid-template-columns: 1fr; }
      .copy-btn { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <a class="profile-link" href="https://gravatar.com/rishabhkrm" target="_blank" rel="noopener noreferrer" aria-label="Open Dr. Rishabh Kumar Mahato's profile">
      <img
        class="avatar"
        src="https://raw.githubusercontent.com/rishabhkrmahato/a-noob-geek-pc-stuff/main/misc/current-me.jpg"
        alt="Dr. Rishabh Kumar Mahato"
      >
    </a>

    <p class="eyebrow">Pay <a class="handle" href="https://www.google.com/search?q=%40rishabhkrm" target="_blank" rel="noopener noreferrer">@rishabhkrm</a></p>
    <h1>Dr. Rishabh Kumar Mahato</h1>
    <p class="subtitle">Scan the QR code or pay directly with UPI</p>

    <div class="qr-wrap">
      <img
        class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi%3A%2F%2Fpay%3Fpa%3Ddr.rishabhkrm%40axisbank%26pn%3DDr.%2520Rishabh%2520Kumar%2520Mahato%26cu%3DINR%26tn%3DTHANK%2520YOU"
        alt="UPI QR Code"
      >
    </div>

    <div class="upi-row" aria-label="UPI ID">
      <span class="upi-dot" aria-hidden="true"></span>
      <span>dr.rishabhkrm@axisbank</span>
    </div>

    <div class="actions">
      <a class="btn" href="upi://pay?pa=dr.rishabhkrm@axisbank&pn=Dr.%20Rishabh%20Kumar%20Mahato&cu=INR&tn=THANK%20YOU">Pay with UPI</a>
      <button class="copy-btn" type="button" onclick="copyUPI(this)">Copy UPI ID</button>
    </div>

    <footer class="footer">© 2026 Dr. Rishabh Kumar Mahato</footer>
  </main>

  <script>
    async function copyUPI(button) {
      const upi = 'dr.rishabhkrm@axisbank';
      try {
        await navigator.clipboard.writeText(upi);
        button.textContent = 'Copied ✓';
        button.classList.add('copied');
        setTimeout(() => {
          button.textContent = 'Copy UPI ID';
          button.classList.remove('copied');
        }, 1800);
      } catch (error) {
        alert('Could not copy the UPI ID automatically.');
      }
    }
  </script>
</body>
</html>
